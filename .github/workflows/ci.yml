name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Throwaway PostgreSQL for the e2e tests. It lives only inside this CI run, so the
    # credentials below are not secrets; they never match any real database.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Also runs `prisma generate` (the API's postinstall), so later steps see the Prisma client.
      - name: Install dependencies from lockfile
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check formatting
        run: npm run format:check

      - name: Test Claude Code hook scripts
        run: npm run test:hooks

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # globalSetup creates pennywise_test, applies the committed migrations (migrate deploy)
      # and the tests run against it. DATABASE_URL is only a placeholder the guard compares to.
      - name: API e2e tests (real PostgreSQL)
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/pennywise_test?schema=public
          DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/pennywise_dev?schema=public

      - name: Build
        run: npm run build
