name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Also runs `prisma generate` (the API's postinstall), so later steps see the Prisma client.
      - name: Install dependencies from lockfile
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check formatting
        run: npm run format:check

      - name: Test Claude Code hook scripts
        run: npm run test:hooks

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: API e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
