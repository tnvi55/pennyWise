name: Feature request
description: A new capability for PennyWise.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: Who needs it and why. What can't they do today?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable statements. Include money and date rules where relevant.
      placeholder: |
        - GET /api/v1/... returns ...
        - The Transactions view shows ...
        - Invalid ... returns 400 with message ...
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: The MVP is single-user, local, INR-only and unauthenticated (plan.md).
      options:
        - Fits the current MVP scope
        - Extends the scope (needs a plan.md / ADR discussion)
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options: [Blocking other work, Needed soon, Nice to have]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Constraints, designs or notes
